<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Streaming</title>
    <!-- FontAwesome untuk Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .player-card {
            width: 100%;
            max-width: 380px;
            background: linear-gradient(180deg, #53403a 0%, #1e1b1a 40%, #121212 100%);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #b3b3b3;
            margin-bottom: 20px;
        }

        .top-bar i {
            font-size: 16px;
            cursor: pointer;
        }

        .album-art {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            margin-bottom: 24px;
        }

        .album-art img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .track-info {
            width: 100%;
            margin-bottom: 15px;
        }

        .track-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .track-artist {
            font-size: 14px;
            color: #b3b3b3;
        }

        .progress-container {
            width: 100%;
            margin-bottom: 20px;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background-color: #4f4f4f;
            border-radius: 2px;
            position: relative;
            cursor: pointer;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background-color: #ffffff;
            border-radius: 2px;
            position: relative;
        }

        /* Dot indikator aktif saat live stream */
        .live-dot {
            position: absolute;
            right: -4px;
            top: -3px;
            width: 10px;
            height: 10px;
            background-color: #1db954;
            border-radius: 50%;
        }

        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #b3b3b3;
            margin-top: 8px;
        }

        .controls {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-icon {
            background: none;
            border: none;
            color: #b3b3b3;
            font-size: 18px;
            cursor: pointer;
            transition: color 0.2s, transform 0.1s;
        }

        .btn-icon:hover {
            color: #ffffff;
        }

        .btn-play {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background-color: #ffffff;
            color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            border: none;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn-play:hover {
            transform: scale(1.05);
            background-color: #f0f0f0;
        }

        .btn-play:active {
            transform: scale(0.95);
        }

        /* Mode tombol jempol aktif */
        .btn-icon.active {
            color: #1db954;
        }
    </style>
</head>
<body>

    <div class="player-card">
        <!-- Baris Atas -->
        <div class="top-bar">
            <i class="fa-solid fa-chevron-down"></i>
            <span>Radio Stream Online</span>
            <i class="fa-solid fa-ellipsis-vertical"></i>
        </div>

        <!-- Gambar Banner / Album Art -->
        <div class="album-art">
          <img src='https://i.postimg.cc/x1Pyx0KZ/Gemini-Generated-Image-q0axywq0axywq0ax.jpg' border='0' alt='Gemini-Generated-Image-q0axywq0axywq0ax'>
        </div>
        <!-- Info Judul dan Radio -->
        <div class="track-info">
            <div class="track-title" id="title">Yoshi 101 Fm</div>
            <div class="track-artist" id="artist">Streaming Radio</div>
        </div>

        <!-- Progress Bar (Menunjukkan Status Live) -->
        <div class="progress-container">
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill" style="width: 100%;">
                    <div class="live-dot"></div>
                </div>
            </div>
            <div class="time-info">
                <span id="status-text">OFFLINE</span>
                <span style="color: #1db954; font-weight: bold;">LIVE</span>
            </div>
        </div>

        <!-- Tombol Kontrol Player -->
        <div class="controls">
            <button class="btn-icon" id="like-btn"><i class="fa-regular fa-thumbs-up"></i></button>
            <button class="btn-icon"><i class="fa-solid fa-backward-step"></i></button>
            
            <button class="btn-play" id="play-btn">
                <i class="fa-solid fa-play" id="play-icon"></i>
            </button>
            
            <button class="btn-icon"><i class="fa-solid fa-forward-step"></i></button>
            <button class="btn-icon" id="dislike-btn"><i class="fa-regular fa-thumbs-down"></i></button>
        </div>
    </div>

    <!-- Audio Element Menggunakan Link Streaming Anda -->
    <audio id="audio-player" src="https://misty-bar-5fa9.yoshi101ofc.workers.dev/"></audio>

    <script>
        const audio = document.getElementById('audio-player');
        const playBtn = document.getElementById('play-btn');
        const playIcon = document.getElementById('play-icon');
        const statusText = document.getElementById('status-text');
        const likeBtn = document.getElementById('like-btn');
        const dislikeBtn = document.getElementById('dislike-btn');

        let isPlaying = false;

        // Fungsi Play / Pause Audio Stream
        function togglePlay() {
            if (isPlaying) {
                audio.pause();
                playIcon.classList.remove('fa-pause');
                playIcon.classList.add('fa-play');
                statusText.innerText = 'PAUSED';
            } else {
                // Reload stream agar saat dimainkan selalu sinkron secara realtime
                audio.load(); 
                audio.play();
                playIcon.classList.remove('fa-play');
                playIcon.classList.add('fa-pause');
                statusText.innerText = 'PLAYING...';
            }
            isPlaying = !isPlaying;
        }

        playBtn.addEventListener('click', togglePlay);

        // Fitur Tambahan Tombol Like / Dislike
        likeBtn.addEventListener('click', () => {
            likeBtn.classList.toggle('active');
            dislikeBtn.classList.remove('active');
        });

        dislikeBtn.addEventListener('click', () => {
            dislikeBtn.classList.toggle('active');
            likeBtn.classList.remove('active');
        });
    </script>
</body>
</html>
